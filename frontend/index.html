<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custody — Graph Memory Security</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: #1a1d2e; border-bottom: 1px solid #2d3748; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
    header h1 { font-size: 1.4rem; color: #a78bfa; font-weight: 700; }
    header p { font-size: 0.85rem; color: #94a3b8; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }
    .card { background: #1e2130; border: 1px solid #2d3748; border-radius: 10px; padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 1rem; color: #a78bfa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 4px; }
    select, button { padding: 8px 14px; border-radius: 6px; border: 1px solid #374151; background: #2d3748; color: #e2e8f0; font-size: 0.9rem; cursor: pointer; }
    button { background: #7c3aed; border-color: #7c3aed; font-weight: 600; transition: background 0.2s; }
    button:hover { background: #6d28d9; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .supported    { background: #065f46; color: #6ee7b7; }
    .conflicting  { background: #7f1d1d; color: #fca5a5; }
    .untrusted    { background: #78350f; color: #fcd34d; }
    .unknown      { background: #1e3a5f; color: #93c5fd; }
    .allowed_naive { background: #374151; color: #d1d5db; }
    .allowed_no_guard { background: #374151; color: #d1d5db; }
    .eval-block { border-left: 3px solid #4b5563; padding-left: 16px; margin-bottom: 16px; }
    .eval-block.conflicting { border-color: #ef4444; }
    .eval-block.untrusted   { border-color: #f59e0b; }
    .eval-block.supported   { border-color: #10b981; }
    .eval-block.unknown     { border-color: #3b82f6; }
    .field { margin-bottom: 8px; }
    .field-label { font-size: 0.75rem; color: #6b7280; }
    .field-value { font-size: 0.9rem; color: #e2e8f0; }
    .provenance-item { background: #111827; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.82rem; font-family: monospace; }
    .path-arrow { color: #7c3aed; margin: 0 6px; }
    #loading { display: none; color: #a78bfa; font-size: 0.9rem; }
    .error-box { background: #450a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 16px; color: #fca5a5; }
    .mode-explain { font-size: 0.78rem; color: #6b7280; margin-top: 8px; }
    .graph-path { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .node-chip { background: #2d3748; border: 1px solid #4b5563; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; font-family: monospace; }
    .node-chip.untrusted { border-color: #f59e0b; color: #fcd34d; }
    .node-chip.verified  { border-color: #10b981; color: #6ee7b7; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🔍 Custody</h1>
      <p>Graph-backed provenance and memory security for AI agents — FalkorDB</p>
    </div>
  </header>

  <main>
    <!-- Controls -->
    <div class="card">
      <h2>Run Demo</h2>
      <div class="controls">
        <div>
          <label for="modeSelect">Guard Mode</label>
          <select id="modeSelect">
            <option value="off">off — no guard</option>
            <option value="naive">naive — memory without provenance check</option>
            <option value="custody" selected>custody — full graph provenance</option>
          </select>
        </div>
        <div>
          <label for="scenarioSelect">Scenario</label>
          <select id="scenarioSelect">
            <option value="scenario_001">scenario_001 — untrusted claim (port 8080)</option>
            <option value="scenario_002">scenario_002 — verified claim (TLS 1.3)</option>
            <option value="scenario_full">scenario_full — both claims</option>
          </select>
        </div>
        <div>
          <button id="resetBtn" onclick="resetDemo()">Reset Graph</button>
        </div>
        <div>
          <button id="runBtn" onclick="runDemo()">▶ Run</button>
        </div>
      </div>
      <p class="mode-explain" id="modeExplain">Custody: The graph determines trust. FalkorDB traverses claim provenance before any decision is made.</p>
      <p id="loading">⏳ Running...</p>
    </div>

    <!-- Results -->
    <div id="results" class="card" style="display:none">
      <h2>Result</h2>
      <div id="resultsContent"></div>
    </div>

    <!-- Provenance viewer -->
    <div id="provenanceCard" class="card" style="display:none">
      <h2>Graph Provenance Path</h2>
      <div id="provenancePath"></div>
    </div>
  </main>

  <script>
    const modeExplains = {
      "off":     "Off: Guard disabled. Claim passes through unconditionally. No FalkorDB check.",
      "naive":   "Naive: Claim recalled from memory and reused, but origin is never verified in the graph.",
      "custody": "Custody: FalkorDB traverses claim → source → evidence. Policy engine makes the decision."
    };

    document.getElementById("modeSelect").addEventListener("change", e => {
      document.getElementById("modeExplain").textContent = modeExplains[e.target.value];
    });

    async function resetDemo() {
      document.getElementById("resetBtn").disabled = true;
      try {
        const res = await fetch("/demo/reset", { method: "POST" });
        const data = await res.json();
        alert(data.message || "Graph reset.");
      } catch(e) { alert("Reset failed: " + e); }
      document.getElementById("resetBtn").disabled = false;
    }

    async function runDemo() {
      const mode = document.getElementById("modeSelect").value;
      const scenario_id = document.getElementById("scenarioSelect").value;
      document.getElementById("runBtn").disabled = true;
      document.getElementById("loading").style.display = "block";
      document.getElementById("results").style.display = "none";
      document.getElementById("provenanceCard").style.display = "none";

      try {
        const res = await fetch("/demo/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode, scenario_id })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.detail || "Unknown error");
          return;
        }
        renderResults(data);
      } catch(e) {
        showError(e.toString());
      } finally {
        document.getElementById("runBtn").disabled = false;
        document.getElementById("loading").style.display = "none";
      }
    }

    function showError(msg) {
      const el = document.getElementById("resultsContent");
      el.innerHTML = `<div class="error-box">❌ ${msg}</div>`;
      document.getElementById("results").style.display = "block";
    }

    function renderResults(data) {
      const el = document.getElementById("resultsContent");
      let html = `
        <div class="field"><span class="field-label">Mode</span><br>
          <span class="field-value">${data.mode}</span></div>
        <div class="field"><span class="field-label">Scenario</span><br>
          <span class="field-value">${data.scenario_id}</span></div>
        <div class="field"><span class="field-label">Sessions</span><br>
          <span class="field-value" style="font-family:monospace;font-size:0.8rem">
            Researcher: ${data.researcher_session}<br>
            Assistant: ${data.assistant_session}
          </span></div>
        <hr style="border-color:#2d3748;margin:16px 0">
        <h3 style="font-size:0.9rem;color:#94a3b8;margin-bottom:12px">Evaluations</h3>
      `;

      for (const ev of data.evaluations) {
        const d = ev.decision || "unknown";
        const cssClass = d.replace(/_/g, '-');
        html += `
          <div class="eval-block ${cssClass}">
            <div class="field">
              <span class="field-label">Claim</span><br>
              <span class="field-value" style="font-family:monospace">${ev.claim_id}</span>
            </div>
            <div class="field">
              <span class="field-label">Decision</span><br>
              <span class="status-badge ${cssClass}">${d.toUpperCase()}</span>
            </div>
            <div class="field">
              <span class="field-label">Reason</span><br>
              <span class="field-value">${ev.reason_code}</span>
            </div>
            <div class="field">
              <span class="field-label">Explanation</span><br>
              <span class="field-value">${ev.explanation}</span>
            </div>
            ${ev.evidence && ev.evidence.length > 0 ? `
            <div class="field">
              <span class="field-label">Evidence Used</span><br>
              <span class="field-value" style="font-family:monospace">${ev.evidence.join(', ')}</span>
            </div>` : ''}
          </div>
        `;

        // Show provenance path if available
        if (ev.provenance && ev.provenance.length > 0) {
          renderProvenance(ev.provenance, ev.claim_id);
        }
      }

      el.innerHTML = html;
      document.getElementById("results").style.display = "block";
    }

    function renderProvenance(rows, claimId) {
      const card = document.getElementById("provenanceCard");
      const el = document.getElementById("provenancePath");

      let html = `<p style="font-size:0.8rem;color:#6b7280;margin-bottom:12px">Claim: <code>${claimId}</code></p>`;

      for (const row of rows) {
        const trustClass = row.trust_tier === "untrusted" ? "untrusted" : "verified";
        html += `
          <div class="provenance-item">
            <div class="graph-path">
              <span class="node-chip">Session: ${(row.observed_in_sessions || []).join(', ') || 'N/A'}</span>
              <span class="path-arrow">→</span>
              <span class="node-chip">Claim: ${row.claim_id}</span>
              <span class="path-arrow">ORIGINATED_FROM</span>
              <span class="node-chip ${trustClass}">Source: ${row.source_id} [${row.trust_tier}]</span>
            </div>
            <div style="margin-top:8px;color:#94a3b8;font-size:0.8rem">${row.text || ''}</div>
          </div>
        `;
      }

      el.innerHTML = html;
      card.style.display = "block";
    }
  </script>
</body>
</html>
